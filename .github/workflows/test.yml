name: "test"

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        cache: yarn
        node-version: 24

    - run: yarn

    - name: test
      run: yarn test

    - name: lint
      run: |
        yarn lint
        yarn format-check

    - name: build
      run: yarn dist
